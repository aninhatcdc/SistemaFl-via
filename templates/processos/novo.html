{% extends "base.html" %}

{% block titulo %}
Novo Processo
{% endblock %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-5">
    <div>
        <h2>Novo Processo</h2>
        <p class="text-muted mb-0">
            Cliente: <strong>{{ cliente.nome }}</strong>
        </p>
    </div>

    <a href="{{ url_for('clientes.detalhes_cliente', id=cliente.id) }}" class="btn btn-secondary">
        ← Cancelar
    </a>
</div>

<form method="POST">

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-bold">
            ⚖ Informações do Processo
        </div>

        <div class="card-body">
            <div class="row">

                <div class="col-md-12 mb-3">
                    <label class="form-label">Número do Processo</label>
                    <input type="text" class="form-control" name="numero" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Área Jurídica</label>
                    <select class="form-select" name="area">
                        <option value="">Selecione...</option>
                        <option>Trabalhista</option>
                        <option>Cível</option>
                        <option>Criminal</option>
                        <option>Previdenciário</option>
                        <option>Administrativo</option>
                        <option>Consumidor</option>
                        <option>Tributário</option>
                        <option>Empresarial</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Situação</label>
                    <select class="form-select" name="situacao">
                        <option value="">Selecione...</option>
                        <option>Em andamento</option>
                        <option>Aguardando documentos</option>
                        <option>Aguardando audiência</option>
                        <option>Suspenso</option>
                        <option>Finalizado</option>
                        <option>Arquivado</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Tribunal</label>
                    <input type="text" class="form-control" name="tribunal">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Comarca</label>
                    <input type="text" class="form-control" name="comarca">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Vara</label>
                    <input type="text" class="form-control" name="vara">
                </div>

                <div class="col-md-12">
                    <label class="form-label">Advogado Responsável</label>
                    <input type="text" class="form-control" name="advogado">
                </div>

            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white fw-bold">
            📅 Datas e Prazos
        </div>

        <div class="card-body">
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Data de Entrada</label>
                    <input type="date" class="form-control" name="data_entrada">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Próximo Prazo</label>
                    <input type="date" class="form-control" name="proximo_prazo">
                </div>

            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-secondary text-white fw-bold">
            📝 Observações
        </div>

        <div class="card-body">
            <textarea class="form-control" name="observacoes" rows="5"></textarea>
        </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mb-5">
        <a href="{{ url_for('clientes.detalhes_cliente', id=cliente.id) }}" class="btn btn-secondary">
            Cancelar
        </a>

        <button type="submit" class="btn btn-success">
            💾 Salvar Processo
        </button>
    </div>

</form>

{% endblock %}
