services:
  - type: web
    name: sistema-juridico
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-juridico-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: ADMIN_NOME
        sync: false
      - key: STORAGE_ROOT
        value: /var/data
    disk:
      name: sistema-juridico-storage
      mountPath: /var/data
      sizeGB: 10

databases:
  - name: sistema-juridico-db
    databaseName: sistema_juridico
    user: sistema_juridico
    plan: basic-256mb
