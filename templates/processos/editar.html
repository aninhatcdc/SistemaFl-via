{% extends "base.html" %}

{% block titulo %}
Editar Processo
{% endblock %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-5">
    <div>
        <h2>Editar Processo</h2>
        <p class="text-muted mb-0">
            Cliente: <strong>{{ cliente.nome }}</strong>
        </p>
    </div>

    <a href="{{ url_for('clientes.detalhes_cliente', id=cliente.id) }}" class="btn btn-secondary">
        ← Cancelar
    </a>
</div>

<form method="POST">

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-bold">
            ⚖ Informações do Processo
        </div>

        <div class="card-body">
            <div class="row">

                <div class="col-md-12 mb-3">
                    <label class="form-label">Número do Processo</label>
                    <input type="text" class="form-control" name="numero" value="{{ processo.numero or '' }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Área Jurídica</label>
                    <select class="form-select" name="area">
                        <option value="">Selecione...</option>
                        <option {% if processo.area == "Trabalhista" %}selected{% endif %}>Trabalhista</option>
                        <option {% if processo.area == "Cível" %}selected{% endif %}>Cível</option>
                        <option {% if processo.area == "Criminal" %}selected{% endif %}>Criminal</option>
                        <option {% if processo.area == "Previdenciário" %}selected{% endif %}>Previdenciário</option>
                        <option {% if processo.area == "Administrativo" %}selected{% endif %}>Administrativo</option>
                        <option {% if processo.area == "Consumidor" %}selected{% endif %}>Consumidor</option>
                        <option {% if processo.area == "Tributário" %}selected{% endif %}>Tributário</option>
                        <option {% if processo.area == "Empresarial" %}selected{% endif %}>Empresarial</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Situação</label>
                    <select class="form-select" name="situacao">
                        <option value="">Selecione...</option>
                        <option {% if processo.situacao == "Em andamento" %}selected{% endif %}>Em andamento</option>
                        <option {% if processo.situacao == "Aguardando documentos" %}selected{% endif %}>Aguardando documentos</option>
                        <option {% if processo.situacao == "Aguardando audiência" %}selected{% endif %}>Aguardando audiência</option>
                        <option {% if processo.situacao == "Suspenso" %}selected{% endif %}>Suspenso</option>
                        <option {% if processo.situacao == "Finalizado" %}selected{% endif %}>Finalizado</option>
                        <option {% if processo.situacao == "Arquivado" %}selected{% endif %}>Arquivado</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Tribunal</label>
                    <input type="text" class="form-control" name="tribunal" value="{{ processo.tribunal or '' }}">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Comarca</label>
                    <input type="text" class="form-control" name="comarca" value="{{ processo.comarca or '' }}">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Vara</label>
                    <input type="text" class="form-control" name="vara" value="{{ processo.vara or '' }}">
                </div>

                <div class="col-md-12">
                    <label class="form-label">Advogado Responsável</label>
                    <input type="text" class="form-control" name="advogado" value="{{ processo.advogado or '' }}">
                </div>

            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white fw-bold">
            📅 Datas e Prazos
        </div>

        <div class="card-body">
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Data de Entrada</label>
                    <input type="date" class="form-control" name="data_entrada"
                           value="{% if processo.data_entrada %}{{ processo.data_entrada.strftime('%Y-%m-%d') }}{% endif %}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Próximo Prazo</label>
                    <input type="date" class="form-control" name="proximo_prazo"
                           value="{% if processo.proximo_prazo %}{{ processo.proximo_prazo.strftime('%Y-%m-%d') }}{% endif %}">
                </div>

            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-secondary text-white fw-bold">
            📝 Observações
        </div>

        <div class="card-body">
            <textarea class="form-control" name="observacoes" rows="5">{{ processo.observacoes or '' }}</textarea>
        </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mb-5">
        <a href="{{ url_for('clientes.detalhes_cliente', id=cliente.id) }}" class="btn btn-secondary">
            Cancelar
        </a>

        <button type="submit" class="btn btn-success">
            💾 Salvar Alterações
        </button>
    </div>

</form>

{% endblock %}
